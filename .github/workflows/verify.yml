# .github/workflows/verify.yml
# ============================================================================
# CORRECTED after Codex's v5 ruling, blocking finding 1.
#
# WHAT WENT WRONG, RECORDED HERE BECAUSE THE FIX IS ONLY LEGIBLE NEXT TO IT:
#
#   The previous version ran:
#       supabase db query -f manifest.sql --linked | tee manifest-A.txt
#
#   No manifest.sql was tracked in the repository. The CLI failed. `tee` succeeded.
#   A shell pipeline reports the exit status of its LAST command, and `pipefail` was
#   not set, so the step exited 0. The next step diffed two identical error messages
#   and printed "A == B". The artifact was 266 bytes of
#   "failed to read SQL file: NotFound", and the job was green.
#
#   Two clean database builds really did run and really did apply all 58 migrations.
#   But the property being claimed -- that the two builds produce the same schema --
#   was never tested at all.
#
# THE PRINCIPLE THIS FILE NOW FOLLOWS: a verification step must fail closed. Absence
# of evidence must never render as evidence. Every check below is a POSITIVE assertion
# about content, not an absence of an error string, because an absence is exactly what
# a broken command produces.
#
# CONCRETE DEFENCES, each mapped to a way the previous version could lie:
#   set -euo pipefail        a failing command in a pipeline can no longer be masked
#   no pipelines at all      output is redirected, never teed
#   test -f on the SQL       a missing query file fails before the CLI is invoked
#   test -s on the output    an empty result is a failure, not a match
#   line-shape assertion     >= 200 lines must match the manifest's own row format,
#                            so an error page cannot pass as a manifest
#   migration-count assertion the manifest must itself report EXPECTED_MIGRATIONS applied
#   sha256 of both files     recorded in the log, so equality is auditable after the fact
#   upload AFTER validation  a rejected manifest is never published as evidence
#   negative_control input   proves the guard fires, on demand, by pointing the query
#                            at a file that does not exist
#
# Third-party actions are pinned to commit SHAs. Version tags are mutable; a tag can be
# repointed at new code after review. The Supabase CLI is pinned to an exact version for
# the same reason -- `latest` means the toolchain can change under a passing build.
# ============================================================================

name: verify

on:
  push:
    branches: ['clean/**']
  pull_request:
    branches: ['clean/**']
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Run the A/B clean-build pair against STAGING'
        type: boolean
        default: false
      negative_control:
        description: 'NEGATIVE CONTROL: point the manifest query at a missing file. The job MUST fail.'
        type: boolean
        default: false
      staging_gate:
        description: 'Run the staging integration gate (real routes, real staging database) TWICE'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SUPABASE_CLI_VERSION: '2.110.0'
  STAGING_REF_EXPECTED: 'tileejdviuvijumjeplv'
  PRODUCTION_REF_DENIED: 'ecapmcyumpjjgjwuokyv'
  MIN_MANIFEST_LINES: '200'
  # 58 -> 59 with 0058_coi_manual_review.sql. Codex v6: update every explicit count
  # assertion and rerun the clean-build gate rather than falsifying the number or
  # folding the change into an already-applied migration.
  EXPECTED_MIGRATIONS: '61'

jobs:
  # --------------------------------------------------------------------------
  # Non-live suites. Windows is the point: path.sep is '\' there, which is the
  # defect class Codex found in v4 and which cannot be exercised on Linux.
  # --------------------------------------------------------------------------
  suites:
    name: suites (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      # npm ci, not npm install: installs exactly the locked tree, so the ESLint the
      # checker runs is the pinned one. The lockfile was gitignored until 822eb85,
      # which meant this reproducibility claim was previously false.
      - run: npm ci

      - name: migration file count matches EXPECTED_MIGRATIONS
        run: |
          set -euo pipefail
          n=$(ls supabase/migrations/*.sql | wc -l)
          echo "migration files: $n"
          test "$n" -eq "${EXPECTED_MIGRATIONS}"

      - run: node tools/check-migrations.mjs
      - run: node tools/check-imports.mjs
      - run: node tools/check-undefined.mjs
      - run: node tools/check-binding.mjs

      - run: node tests/binding.test.mjs
      - run: node tests/route_binding.test.mjs
      - run: node tests/mail_containment.test.mjs
      - run: node tests/launch_flags.test.mjs
      - run: node tests/brand_signup.test.mjs
      - run: node tests/coi_enforcement_gate.test.mjs
      - run: node tests/session_transport.test.mjs
      - run: node tests/coi_policy_matrix.test.mjs

  # --------------------------------------------------------------------------
  # A/B clean build. Manual only -- `db reset` is destructive and must never fire
  # on a push.
  # --------------------------------------------------------------------------
  clean-build:
    name: clean build A/B (staging)
    if: github.event_name == 'workflow_dispatch' && inputs.clean_build
    needs: suites
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.2.2

      # Runs before the CLI is installed and before any secret is in scope. Two
      # independent conditions: the target must equal the staging ref, and the
      # production ref is refused by name even if the variable were edited.
      - name: refuse any target that is not staging
        env:
          TARGET_REF: ${{ vars.STAGING_PROJECT_REF }}
        run: |
          set -euo pipefail
          echo "target: ${TARGET_REF:-<unset>}"
          if [ -z "${TARGET_REF:-}" ]; then
            echo "REFUSING: STAGING_PROJECT_REF is not set"; exit 1
          fi
          if [ "$TARGET_REF" != "${STAGING_REF_EXPECTED}" ]; then
            echo "REFUSING: $TARGET_REF is not the approved staging project"; exit 1
          fi
          if [ "$TARGET_REF" = "${PRODUCTION_REF_DENIED}" ]; then
            echo "REFUSING: $TARGET_REF is PRODUCTION"; exit 1
          fi
          echo "target accepted"

      # The manifest query must exist BEFORE anything destructive runs. Discovering it
      # missing after two resets is how the previous version wasted a whole build pair
      # and then reported success anyway.
      - name: manifest query must exist and be read-only
        run: |
          set -euo pipefail
          test -f supabase/manifest.sql || { echo "FAIL: supabase/manifest.sql is missing"; exit 1; }
          test -s supabase/manifest.sql || { echo "FAIL: supabase/manifest.sql is empty"; exit 1; }
          if grep -inE '^[[:space:]]*(insert|update|delete|drop|alter|truncate|grant|revoke|create)[[:space:]]' supabase/manifest.sql; then
            echo "FAIL: manifest query contains a write statement"; exit 1
          fi
          echo "manifest query present, $(wc -l < supabase/manifest.sql) lines, read-only"

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1  # v1.7.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: record CLI version
        run: |
          set -euo pipefail
          supabase --version

      # Secrets are scoped to the steps that need them, never to the job.
      # `supabase link` performs a NON-DESTRUCTIVE remote project status lookup, and that
      # lookup is where HEAD failed with
      #     Unexpected error retrieving remote project status: {"message":"Unauthorized"}
      # The retry added earlier covered only capture-manifest.sh, so it could not help here.
      # Codex v6 directs the same bounded transient handling be applied to this call.
      #
      # If all three attempts return 401 the job FAILS and says why: a persistent 401 means
      # the credential is invalid, not infrastructure noise.
      - name: link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          TARGET_REF: ${{ vars.STAGING_PROJECT_REF }}
        run: |
          set -euo pipefail
          source ./.github/scripts/retry-transient.sh
          _link() { supabase link --project-ref "$TARGET_REF" -p "$DB_PASSWORD"; }
          retry_transient "supabase link" _link

      - name: build A
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase db reset --linked --yes

      - name: manifest A
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEGATIVE_CONTROL: ${{ inputs.negative_control }}
        run: ./.github/scripts/capture-manifest.sh manifest-A.raw.txt

      - name: build B
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase db reset --linked --yes

      - name: manifest B
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEGATIVE_CONTROL: ${{ inputs.negative_control }}
        run: ./.github/scripts/capture-manifest.sh manifest-B.raw.txt

      # The comparison is executed by the run. If A and B differ the job fails; no
      # human is asked to eyeball two blocks of text and declare them equal.
      - name: manifests must be byte-identical after documented normalization
        run: |
          set -euo pipefail
          echo "sha256 (normalized):"
          sha256sum manifest-A.txt manifest-B.txt
          if ! diff -u manifest-A.txt manifest-B.txt > manifest-diff.txt; then
            echo "FAIL: Build A and Build B produced different schemas"
            head -100 manifest-diff.txt
            exit 1
          fi
          echo "A == B  ($(wc -l < manifest-A.txt) manifest lines each)"

      # Provision the deployment identity AFTER both manifests are captured, so the
      # comparison above describes the schema as the migration chain builds it, not as
      # an operator afterwards configures it.
      #
      # This step exists because the staging gate proved a freshly reset database serves
      # ZERO requests: deployment_identity is empty, set_deployment_identity is
      # deliberately unreachable from service_role, and the binding layer fails closed on
      # an unprovisioned identity. Every one of those is correct in isolation; together
      # they mean the cutover needs an explicit privileged step, and that step now exists
      # in version control and is exercised on every build rather than living in someone's
      # memory.
      - name: provision deployment identity (the production cutover step)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: ./.github/scripts/provision-identity.sh preview '${{ vars.STAGING_PROJECT_REF }}'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: clean-build-manifests
          path: |
            manifest-A.txt
            manifest-B.txt
            manifest-A.raw.txt
            manifest-B.raw.txt
            manifest-diff.txt
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # STAGING INTEGRATION GATE -- Codex v5 blocking finding 2.
  #
  # These suites existed but were wired into nothing: not in package.json, not in any
  # workflow, no execution evidence. A test that is never run is indistinguishable from
  # a test that does not exist, which is the same species of defect as a checker with an
  # exemption or a manifest step that cannot fail.
  #
  # Runs ONLY on manual dispatch, ONLY after the corrected clean-build gate, and ONLY
  # against the disposable staging project. The `environment: staging` binding means a
  # human must approve before it touches anything.
  #
  # TWO CONSECUTIVE PASSES from one immutable commit: pass-2 `needs` pass-1, so they
  # cannot interleave and cannot run from different source. One green run can be luck --
  # a leftover fixture, a warm cache, an ordering accident. Two consecutive runs from the
  # same SHA is the weakest claim that is still worth making.
  # --------------------------------------------------------------------------
  staging-gate-pass-1:
    name: staging gate (pass 1)
    if: github.event_name == 'workflow_dispatch' && inputs.staging_gate
    needs: clean-build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: assert target is the approved staging project
        env:
          TARGET_REF: ${{ vars.STAGING_PROJECT_REF }}
        run: ./.github/scripts/assert-staging.sh
      - name: staging suites
        env:
          SB_REF: ${{ vars.STAGING_PROJECT_REF }}
          SB_URL: https://${{ vars.STAGING_PROJECT_REF }}.supabase.co
          SB_KEY: ${{ secrets.STAGING_SB_KEY }}
          LEDGER_TARGET_REF: ${{ vars.STAGING_PROJECT_REF }}
          ALLOW_STAGING_LEDGER_TESTS: 'yes'
        run: |
          set -euo pipefail
          echo "commit under test: ${GITHUB_SHA}"
          npm run test:staging

  staging-gate-pass-2:
    name: staging gate (pass 2, consecutive, same commit)
    if: github.event_name == 'workflow_dispatch' && inputs.staging_gate
    needs: staging-gate-pass-1
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: assert target is the approved staging project
        env:
          TARGET_REF: ${{ vars.STAGING_PROJECT_REF }}
        run: ./.github/scripts/assert-staging.sh
      - name: staging suites
        env:
          SB_REF: ${{ vars.STAGING_PROJECT_REF }}
          SB_URL: https://${{ vars.STAGING_PROJECT_REF }}.supabase.co
          SB_KEY: ${{ secrets.STAGING_SB_KEY }}
          LEDGER_TARGET_REF: ${{ vars.STAGING_PROJECT_REF }}
          ALLOW_STAGING_LEDGER_TESTS: 'yes'
        run: |
          set -euo pipefail
          echo "commit under test: ${GITHUB_SHA}"
          npm run test:staging
