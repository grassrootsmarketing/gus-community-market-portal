# .github/workflows/verify.yml
# ============================================================================
# CORRECTED after Codex's v5 ruling, blocking finding 1.
#
# WHAT WENT WRONG, RECORDED HERE BECAUSE THE FIX IS ONLY LEGIBLE NEXT TO IT:
#
#   The previous version ran:
#       supabase db query -f manifest.sql --linked | tee manifest-A.txt
#
#   No manifest.sql was tracked in the repository. The CLI failed. `tee` succeeded.
#   A shell pipeline reports the exit status of its LAST command, and `pipefail` was
#   not set, so the step exited 0. The next step diffed two identical error messages
#   and printed "A == B". The artifact was 266 bytes of
#   "failed to read SQL file: NotFound", and the job was green.
#
#   Two clean database builds really did run and really did apply all 58 migrations.
#   But the property being claimed -- that the two builds produce the same schema --
#   was never tested at all.
#
# THE PRINCIPLE THIS FILE NOW FOLLOWS: a verification step must fail closed. Absence
# of evidence must never render as evidence. Every check below is a POSITIVE assertion
# about content, not an absence of an error string, because an absence is exactly what
# a broken command produces.
#
# CONCRETE DEFENCES, each mapped to a way the previous version could lie:
#   set -euo pipefail        a failing command in a pipeline can no longer be masked
#   no pipelines at all      output is redirected, never teed
#   test -f on the SQL       a missing query file fails before the CLI is invoked
#   test -s on the output    an empty result is a failure, not a match
#   line-shape assertion     >= 200 lines must match the manifest's own row format,
#                            so an error page cannot pass as a manifest
#   migration-count assertion the manifest must itself report EXPECTED_MIGRATIONS applied
#   sha256 of both files     recorded in the log, so equality is auditable after the fact
#   upload AFTER validation  a rejected manifest is never published as evidence
#   negative_control input   proves the guard fires, on demand, by pointing the query
#                            at a file that does not exist
#
# Third-party actions are pinned to commit SHAs. Version tags are mutable; a tag can be
# repointed at new code after review. The Supabase CLI is pinned to an exact version for
# the same reason -- `latest` means the toolchain can change under a passing build.
# ============================================================================

name: verify

on:
  # 2026-08-20 (Codex round 3): main was NOT covered by this workflow — pushes/PRs to the branch
  # that actually deploys ran no verification. main is now a first-class trigger alongside the
  # clean/** and launch/** working branches, and should be a required status check in branch
  # protection so the deploying branch can never go green without these suites passing.
  push:
    branches: ['main', 'clean/**', 'launch/**']
  pull_request:
    branches: ['main', 'clean/**', 'launch/**']
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Run the A/B clean-build pair against STAGING'
        type: boolean
        default: false
      negative_control:
        description: 'NEGATIVE CONTROL: point the manifest query at a missing file. The job MUST fail.'
        type: boolean
        default: false
      staging_gate:
        description: 'Run the staging integration gate (real routes, real staging database) TWICE'
        type: boolean
        default: false
      upgrade_rehearsal:
        description: 'Codex R4-04: rehearse the PRODUCTION upgrade path on STAGING (reset to 0072 -> seed -> migration up 0074..0081 without 0073 -> verify -> reset)'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SUPABASE_CLI_VERSION: '2.110.0'
  STAGING_REF_EXPECTED: 'tileejdviuvijumjeplv'
  # 2026-09-04 (Codex round 2, F-09): current production project. The positive STAGING_REF_EXPECTED
  # check is the primary guard; this deny value is belt-and-braces and must name the LIVE prod ref.
  PRODUCTION_REF_DENIED: 'dkgjvsstbgnhcfboqqnd'
  MIN_MANIFEST_LINES: '200'
  # Codex v6: update every explicit count assertion and rerun the clean-build gate rather than
  # falsifying the number or folding the change into an already-applied migration.
  # 2026-08-20 (Codex round 3): the reviewed tree carried 67 migration files while this asserted 62,
  # so the gate failed on every run of that commit. Round 3 adds 0067_coi_review_atomic_expiry.sql
  # (P0-4), bringing the total to 68. If you add a migration, bump this and rerun the clean-build gate.
  # 2026-09-03 (Codex final-launch remediation, Phase D): 0069_capacity_decrease_guard.sql -> 70.
  # 2026-09-04 (Codex round 2): 0070_capacity_serialization + 0071_compliance_tenant_integrity -> 72.
  # 2026-09-04 (Codex cleanup FC-02): 0072_support_access_atomic.sql -> 73 SQL files (README.md is not a migration).
  # 2026-09-06 (store-contact notifications): 0073_demo_notifications.sql -> 74.
  # 2026-09-06 (Codex feature round, Release A): 0074_release_a_schedule_and_outbox.sql -> 75 SQL files.
  # 2026-09-10 (Codex feature round, Release B): 0075_release_b_slots_blackouts.sql -> 76 SQL files.
  # 2026-09-11 (Codex Release B review, B-01..B-08): 0076_release_b_corrections.sql -> 77 SQL files.
  # 2026-09-11 (Codex closure review R2/R4/R5/R6): 0077_release_b_projection_and_transitions.sql -> 78 SQL files.
  EXPECTED_MIGRATIONS: '82'

jobs:
  # --------------------------------------------------------------------------
  # Non-live suites. Windows is the point: path.sep is '\' there, which is the
  # defect class Codex found in v4 and which cannot be exercised on Linux.
  # --------------------------------------------------------------------------
  suites:
    name: suites (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: npm

      # npm ci, not npm install: installs exactly the locked tree, so the ESLint the
      # checker runs is the pinned one. The lockfile was gitignored until 822eb85,
      # which meant this reproducibility claim was previously false.
      - run: npm ci

      - name: migration file count matches EXPECTED_MIGRATIONS
        run: |
          set -euo pipefail
          n=$(ls supabase/migrations/*.sql | wc -l)
          echo "migration files: $n"
          test "$n" -eq "${EXPECTED_MIGRATIONS}"

      - run: node tools/check-migrations.mjs
      - run: node tools/check-imports.mjs
      - run: node tools/check-undefined.mjs
      - run: node tools/check-html-undef.mjs
      - run: node tools/check-binding.mjs

      # CL-03 (Codex final work order): run the SINGLE source of truth for the offline suite —
      # package.json "test" — instead of re-enumerating it here. The manual list had drifted: it
      # stopped at admin_cancel_wiring and silently omitted the round-3 security guards
      # (admin_table_guard, provisional_resolution), so those never ran in CI despite comments
      # claiming they did. `npm test` runs every offline suite AND stays in sync as tests are added.
      - run: npm test

  # --------------------------------------------------------------------------
  # A/B clean build. Manual only -- `db reset` is destructive and must never fire
  # on a push.
  # --------------------------------------------------------------------------
  clean-build:
    name: clean build A/B (staging)
    if: github.event_name == 'workflow_dispatch' && inputs.clean_build
    needs: suites
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0

      # Runs before the CLI is installed and before any secret is in scope. Two
      # independent conditions: the target must equal the staging ref, and the
      # production ref is refused by name even if the variable were edited.
      - name: refuse any target that is not staging
        env:
          TARGET_REF: ${{ vars.STAGING_PROJECT_REF }}
        run: |
          set -euo pipefail
          echo "target: ${TARGET_REF:-<unset>}"
          if [ -z "${TARGET_REF:-}" ]; then
            echo "REFUSING: STAGING_PROJECT_REF is not set"; exit 1
          fi
          if [ "$TARGET_REF" != "${STAGING_REF_EXPECTED}" ]; then
            echo "REFUSING: $TARGET_REF is not the approved staging project"; exit 1
          fi
          if [ "$TARGET_REF" = "${PRODUCTION_REF_DENIED}" ]; then
            echo "REFUSING: $TARGET_REF is PRODUCTION"; exit 1
          fi
          echo "target accepted"

      # The manifest query must exist BEFORE anything destructive runs. Discovering it
      # missing after two resets is how the previous version wasted a whole build pair
      # and then reported success anyway.
      - name: manifest query must exist and be read-only
        run: |
          set -euo pipefail
          test -f supabase/manifest.sql || { echo "FAIL: supabase/manifest.sql is missing"; exit 1; }
          test -s supabase/manifest.sql || { echo "FAIL: supabase/manifest.sql is empty"; exit 1; }
          if grep -inE '^[[:space:]]*(insert|update|delete|drop|alter|truncate|grant|revoke|create)[[:space:]]' supabase/manifest.sql; then
            echo "FAIL: manifest query contains a write statement"; exit 1
          fi
          echo "manifest query present, $(wc -l < supabase/manifest.sql) lines, read-only"

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1  # v1.7.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: record CLI version
        run: |
          set -euo pipefail
          supabase --version

      # Secrets are scoped to the steps that need them, never to the job.
      # `supabase link` performs a NON-DESTRUCTIVE remote project status lookup, and that
      # lookup is where HEAD failed with
      #     Unexpected error retrieving remote project status: {"message":"Unauthorized"}
      # The retry added earlier covered only capture-manifest.sh, so it could not help here.
      # Codex v6 directs the same bounded transient handling be applied to this call.
      #
      # If all three attempts return 401 the job FAILS and says why: a persistent 401 means
      # the credential is invalid, not infrastructure noise.
      - name: link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          TARGET_REF: ${{ vars.STAGING_PROJECT_REF }}
        run: |
          set -euo pipefail
          source ./.github/scripts/retry-transient.sh
          _link() { supabase link --project-ref "$TARGET_REF" -p "$DB_PASSWORD"; }
          retry_transient "supabase link" _link

      - name: build A
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase db reset --linked --yes

      - name: manifest A
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEGATIVE_CONTROL: ${{ inputs.negative_control }}
        run: ./.github/scripts/capture-manifest.sh manifest-A.raw.txt

      - name: build B
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase db reset --linked --yes

      - name: manifest B
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEGATIVE_CONTROL: ${{ inputs.negative_control }}
        run: ./.github/scripts/capture-manifest.sh manifest-B.raw.txt

      # The comparison is executed by the run. If A and B differ the job fails; no
      # human is asked to eyeball two blocks of text and declare them equal.
      - name: manifests must be byte-identical after documented normalization
        run: |
          set -euo pipefail
          echo "sha256 (normalized):"
          sha256sum manifest-A.txt manifest-B.txt
          if ! diff -u manifest-A.txt manifest-B.txt > manifest-diff.txt; then
            echo "FAIL: Build A and Build B produced different schemas"
            head -100 manifest-diff.txt
            exit 1
          fi
          echo "A == B  ($(wc -l < manifest-A.txt) manifest lines each)"

      # Provision the deployment identity AFTER both manifests are captured, so the
      # comparison above describes the schema as the migration chain builds it, not as
      # an operator afterwards configures it.
      #
      # This step exists because the staging gate proved a freshly reset database serves
      # ZERO requests: deployment_identity is empty, set_deployment_identity is
      # deliberately unreachable from service_role, and the binding layer fails closed on
      # an unprovisioned identity. Every one of those is correct in isolation; together
      # they mean the cutover needs an explicit privileged step, and that step now exists
      # in version control and is exercised on every build rather than living in someone's
      # memory.
      - name: provision deployment identity (the production cutover step)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: ./.github/scripts/provision-identity.sh preview '${{ vars.STAGING_PROJECT_REF }}'

      # Codex v6-FINAL: the header claimed manifests are uploaded only after validation,
      # but `if: always()` published them on failure too — under the same artifact name.
      # A rejected manifest that carries the evidence name is exactly the confusion this
      # gate exists to prevent, so success-only it is. Failure diagnostics go up under a
      # name that cannot be mistaken for validated evidence.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clean-build-manifests
          path: |
            manifest-A.txt
            manifest-B.txt
            manifest-A.raw.txt
            manifest-B.raw.txt
            manifest-diff.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: failed-clean-build-diagnostics
          path: |
            manifest-A.raw.txt
            manifest-B.raw.txt
            manifest-A.txt
            manifest-B.txt
            manifest-diff.txt
            provision.err
            verify.err

  # --------------------------------------------------------------------------
  # STAGING INTEGRATION GATE -- Codex v5 blocking finding 2.
  #
  # These suites existed but were wired into nothing: not in package.json, not in any
  # workflow, no execution evidence. A test that is never run is indistinguishable from
  # a test that does not exist, which is the same species of defect as a checker with an
  # exemption or a manifest step that cannot fail.
  #
  # Runs ONLY on manual dispatch, ONLY after the corrected clean-build gate, and ONLY
  # against the disposable staging project. The `environment: staging` binding means a
  # human must approve before it touches anything.
  #
  # TWO CONSECUTIVE PASSES from one immutable commit: pass-2 `needs` pass-1, so they
  # cannot interleave and cannot run from different source. One green run can be luck --
  # a leftover fixture, a warm cache, an ordering accident. Two consecutive runs from the
  # same SHA is the weakest claim that is still worth making.
  # --------------------------------------------------------------------------
  staging-gate-pass-1:
    name: staging gate (pass 1)
    if: github.event_name == 'workflow_dispatch' && inputs.staging_gate
    needs: clean-build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: assert target is the approved staging project
        env:
          TARGET_REF: ${{ vars.STAGING_PROJECT_REF }}
        run: ./.github/scripts/assert-staging.sh
      - name: staging suites
        env:
          SB_REF: ${{ vars.STAGING_PROJECT_REF }}
          SB_URL: https://${{ vars.STAGING_PROJECT_REF }}.supabase.co
          SB_KEY: ${{ secrets.STAGING_SB_KEY }}
          LEDGER_TARGET_REF: ${{ vars.STAGING_PROJECT_REF }}
          ALLOW_STAGING_LEDGER_TESTS: 'yes'
          # Codex round 2 (F-01): tests/capacity_serialization.test.mjs needs real Postgres sessions.
          # Session-pooler URI (IPv4; runners have no IPv6), user postgres.<ref>, port 5432.
          SB_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          set -euo pipefail
          echo "commit under test: ${GITHUB_SHA}"
          npm run test:staging

  staging-gate-pass-2:
    name: staging gate (pass 2, consecutive, same commit)
    if: github.event_name == 'workflow_dispatch' && inputs.staging_gate
    needs: staging-gate-pass-1
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: assert target is the approved staging project
        env:
          TARGET_REF: ${{ vars.STAGING_PROJECT_REF }}
        run: ./.github/scripts/assert-staging.sh
      - name: staging suites
        env:
          SB_REF: ${{ vars.STAGING_PROJECT_REF }}
          SB_URL: https://${{ vars.STAGING_PROJECT_REF }}.supabase.co
          SB_KEY: ${{ secrets.STAGING_SB_KEY }}
          LEDGER_TARGET_REF: ${{ vars.STAGING_PROJECT_REF }}
          ALLOW_STAGING_LEDGER_TESTS: 'yes'
          SB_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          set -euo pipefail
          echo "commit under test: ${GITHUB_SHA}"
          npm run test:staging

  # --------------------------------------------------------------------------
  # UPGRADE REHEARSAL -- Codex Release B round 4, R4-04 (7).
  #
  # A clean build proves the migration CHAIN builds a schema. It does not prove the
  # UPGRADE PATH production will actually take: existing rows (held authorizations, paid
  # work awaiting confirmation, linked demos, an open case) meeting 0074..0081 on a ledger
  # that stops at 0072 and that NEVER applied 0073. This job rehearses exactly that:
  #   1. hide every migration >= 0073 from the CLI and `db reset` staging to 0072 (= production);
  #   2. verify that starting point, then seed production-shaped data through the product's
  #      own ledger RPCs (supabase/rehearsal/seed-pre-0074.sql);
  #   3. un-hide 0074..0081 (0073 stays hidden), `supabase migration up --linked`;
  #   4. verify the ledger tail is exactly 0074..0081, the seeded rows survived with their
  #      snapshots and generation 1, every audit is clean, and the runtime contracts behave;
  #   5. capture the upgraded schema manifest, then restore every file, reset staging to the
  #      full chain, capture the clean manifest, and require the two to match (documented
  #      normalization: the ledger row count differs by exactly the deliberately absent 0073).
  # Manual only, staging only (the same refusals as the clean build), the `staging`
  # environment gate means a human approves before it touches anything. The final reset runs
  # even when an earlier step failed, so staging is never left on a half-upgraded schema.
  # --------------------------------------------------------------------------
  upgrade-rehearsal:
    name: upgrade rehearsal 0072 -> 0081 (staging)
    if: always() && github.event_name == 'workflow_dispatch' && inputs.upgrade_rehearsal && needs.suites.result == 'success' && needs.staging-gate-pass-2.result != 'failure' && needs.staging-gate-pass-2.result != 'cancelled'
    needs: [suites, staging-gate-pass-2]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0

      - name: refuse any target that is not staging
        env:
          TARGET_REF: ${{ vars.STAGING_PROJECT_REF }}
        run: |
          set -euo pipefail
          ./.github/scripts/assert-staging.sh
          if [ "$TARGET_REF" = "${PRODUCTION_REF_DENIED}" ]; then echo "REFUSING: $TARGET_REF is PRODUCTION"; exit 1; fi
          if [ "$TARGET_REF" != "${STAGING_REF_EXPECTED}" ]; then echo "REFUSING: $TARGET_REF is not the approved staging project"; exit 1; fi

      - name: rehearsal files must exist and the manifest query must be read-only
        run: |
          set -euo pipefail
          for f in supabase/rehearsal/verify-pre.sql supabase/rehearsal/seed-pre-0074.sql supabase/rehearsal/verify-ledger.sql supabase/rehearsal/verify-post.sql supabase/manifest.sql; do
            test -s "$f" || { echo "FAIL: $f is missing or empty"; exit 1; }
          done
          if grep -inE '^[[:space:]]*(insert|update|delete|drop|alter|truncate|grant|revoke|create)[[:space:]]' supabase/manifest.sql; then echo "FAIL: manifest query contains a write statement"; exit 1; fi
          echo "rehearsal inputs present"

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1  # v1.7.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: record CLI version
        run: supabase --version

      - name: link
        id: link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          TARGET_REF: ${{ vars.STAGING_PROJECT_REF }}
        run: |
          set -euo pipefail
          source ./.github/scripts/retry-transient.sh
          _link() { supabase link --project-ref "$TARGET_REF" -p "$DB_PASSWORD"; }
          retry_transient "supabase link" _link

      # ---- 1. production's starting point: 0000..0072 applied, nothing at or after 0073 visible ----
      - name: hide every migration >= 0073 (production never applied 0073; 0074+ are the release)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hidden" rehearsal
          for f in supabase/migrations/*.sql; do
            n=$(basename "$f" | cut -c1-4)
            if [ "$((10#$n))" -ge 73 ]; then mv "$f" "$RUNNER_TEMP/hidden/"; fi
          done
          echo "visible: $(ls supabase/migrations/*.sql | wc -l) files, last: $(ls supabase/migrations/*.sql | tail -1)"
          echo "hidden:  $(ls "$RUNNER_TEMP"/hidden/*.sql | wc -l) files: $(ls "$RUNNER_TEMP"/hidden | tr '\n' ' ')"
          test "$(ls supabase/migrations/*.sql | wc -l)" -eq 73 || { echo "FAIL: expected 73 visible files (0000..0072)"; exit 1; }

      - name: reset staging to 0072
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase db reset --linked --yes | tee rehearsal/00-reset-to-0072.txt

      - name: verify the starting point (ledger max 0072, 0073 absent, pre-Release-B contracts)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          source ./.github/scripts/retry-transient.sh
          _q() { supabase db query -f supabase/rehearsal/verify-pre.sql --linked > rehearsal/01-verify-pre.txt 2> rehearsal/01-verify-pre.err; }
          retry_transient "verify-pre" _q || { cat rehearsal/01-verify-pre.err; exit 1; }
          cat rehearsal/01-verify-pre.txt
          supabase migration list --linked > rehearsal/02-ledger-pre.txt 2>&1 || true
          cat rehearsal/02-ledger-pre.txt

      # ---- 2. production-shaped data on the 0072 schema ----
      - name: seed representative data through the product's ledger RPCs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          source ./.github/scripts/retry-transient.sh
          _q() { supabase db query -f supabase/rehearsal/seed-pre-0074.sql --linked > rehearsal/03-seed.txt 2> rehearsal/03-seed.err; }
          retry_transient "seed" _q || { cat rehearsal/03-seed.err; exit 1; }
          cat rehearsal/03-seed.txt

      # ---- 3. the release migrations, in order, with 0073 deliberately still absent ----
      - name: un-hide 0074..end (0073 stays hidden) and apply them with supabase migration up
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP"/hidden/*.sql; do
            n=$(basename "$f" | cut -c1-4)
            if [ "$((10#$n))" -ge 74 ]; then mv "$f" supabase/migrations/; fi
          done
          echo "pending (should be 0074..end): $(ls supabase/migrations | grep -E '^00(7[4-9]|8[0-9])_' | tr '\n' ' ')"
          test ! -e supabase/migrations/0073_demo_notifications.sql || { echo "FAIL: 0073 must stay hidden"; exit 1; }
          supabase migration up --linked --yes 2>&1 | tee rehearsal/04-migration-up.txt

      # ---- 4. the upgraded state ----
      - name: verify the ledger tail is exactly the planned sequence
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          source ./.github/scripts/retry-transient.sh
          supabase migration list --linked > rehearsal/05-ledger-post.txt 2>&1 || true
          cat rehearsal/05-ledger-post.txt
          _q() { supabase db query -f supabase/rehearsal/verify-ledger.sql --linked > rehearsal/06-verify-ledger.txt 2> rehearsal/06-verify-ledger.err; }
          retry_transient "verify-ledger" _q || { cat rehearsal/06-verify-ledger.err; exit 1; }
          cat rehearsal/06-verify-ledger.txt

      - name: verify data, snapshots, audits and runtime contracts on the upgraded rows
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          source ./.github/scripts/retry-transient.sh
          _q() { supabase db query -f supabase/rehearsal/verify-post.sql --linked > rehearsal/07-verify-post.txt 2> rehearsal/07-verify-post.err; }
          retry_transient "verify-post" _q || { cat rehearsal/07-verify-post.err; exit 1; }
          cat rehearsal/07-verify-post.txt

      - name: manifest of the UPGRADED schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ./.github/scripts/capture-manifest.sh rehearsal/manifest-upgraded.raw.txt

      # ---- 5. leave staging on the full chain, and prove upgraded == clean ----
      - name: restore every migration file (0073 included)
        if: always() && steps.link.outcome == 'success'
        run: |
          set -euo pipefail
          if ls "$RUNNER_TEMP"/hidden/*.sql >/dev/null 2>&1; then mv "$RUNNER_TEMP"/hidden/*.sql supabase/migrations/; fi
          n=$(ls supabase/migrations/*.sql | wc -l)
          echo "restored: $n migration files"
          test "$n" -eq "${EXPECTED_MIGRATIONS}" || { echo "FAIL: expected ${EXPECTED_MIGRATIONS} files after restore"; exit 1; }

      - name: final reset of staging to the full chain (always, so staging is never left half-upgraded)
        if: always() && steps.link.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase db reset --linked --yes | tee rehearsal/08-final-reset.txt
          ./.github/scripts/provision-identity.sh preview '${{ vars.STAGING_PROJECT_REF }}'

      - name: manifest of the CLEAN schema, compared with the upgraded one
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ./.github/scripts/capture-manifest.sh rehearsal/manifest-clean.raw.txt
          # Documented normalization: the ledger ROW COUNT legitimately differs by one (0073 is
          # absent on the upgrade path by design). Nothing else may differ.
          grep -vE 'count migrations = [0-9]+' rehearsal/manifest-upgraded.txt > rehearsal/manifest-upgraded.cmp.txt
          grep -vE 'count migrations = [0-9]+' rehearsal/manifest-clean.txt > rehearsal/manifest-clean.cmp.txt
          sha256sum rehearsal/manifest-upgraded.cmp.txt rehearsal/manifest-clean.cmp.txt
          if ! diff -u rehearsal/manifest-upgraded.cmp.txt rehearsal/manifest-clean.cmp.txt > rehearsal/manifest-diff.txt; then
            echo "FAIL: the UPGRADED schema differs from a CLEAN build (beyond the ledger row count)"; head -120 rehearsal/manifest-diff.txt; exit 1
          fi
          echo "upgraded == clean  ($(wc -l < rehearsal/manifest-clean.cmp.txt) manifest lines each, ledger count excluded by documented normalization)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upgrade-rehearsal-evidence
          path: rehearsal/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: failed-upgrade-rehearsal-diagnostics
          path: rehearsal/
          if-no-files-found: warn
