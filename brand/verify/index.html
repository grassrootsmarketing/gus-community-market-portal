<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<title>Signing you in… — Demohub</title>
<style>
body { font-family:-apple-system,sans-serif; background:#fbf7f0; color:#1c1c1a; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
.box { background:white; border:1px solid rgba(15,44,23,0.08); border-radius:16px; padding:40px 48px; max-width:420px; text-align:center; }
h1 { font-family:Georgia,serif; font-weight:400; font-size:1.6rem; color:#0f2c17; margin:0 0 12px; }
p { color:#3a3a36; font-size:0.95rem; line-height:1.5; margin:0; }
a { display:inline-block; margin-top:20px; padding:10px 22px; background:#0f2c17; color:white; border-radius:99px; text-decoration:none; font-weight:600; font-size:0.92rem; }
.err { color:#a14e2a; }
.spinner { display:inline-block; width:32px; height:32px; border:3px solid #e3edd6; border-top-color:#3a7142; border-radius:50%; animation:spin 0.7s linear infinite; margin-bottom:16px; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="box" id="box">
  <div class="spinner"></div>
  <h1>Signing you in…</h1>
  <p>Verifying your link.</p>
</div>
<script>
(async () => {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('t');
  // Codex finding B: strip the token from the address bar the instant it is captured, before the
  // exchange below is even started. Doing it after the await would leave a single-use sign-in
  // credential in browser history — and in the Referer of any subresource — for as long as the
  // request took. window.location.pathname keeps us on this page with no query string.
  history.replaceState(null, '', window.location.pathname);
  const box = document.getElementById('box');
  if (!token) {
    box.innerHTML = '<h1>Bad link</h1><p>This link is missing its verification token.</p><a href="/brand/signin">Try again</a>';
    return;
  }
  try {
    const r = await fetch('/api/brand-account?action=verify', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ token }),
      credentials: 'same-origin',
    });
    const json = await r.json();
    if (!r.ok || !json.ok) throw new Error(json.error || 'Verification failed');
    // Codex finding B: no localStorage write. The verify response sets the HttpOnly
    // dh_brand_session cookie, which the browser attaches to every later request on its own.
    // The old copy in localStorage was readable by any injected script and outlived the tab.
    window.location.href = '/brand/dashboard';
  } catch (err) {
    box.innerHTML = `<h1 class="err">Couldn't sign you in</h1><p>${String(err.message || 'The link may have expired.').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</p><a href="/brand/signin">Request a new link</a>`;
  }
})();
</script>
</body>
</html>
